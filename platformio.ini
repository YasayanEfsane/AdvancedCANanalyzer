[platformio]
src_dir = firmware/src
include_dir = firmware/include
default_envs = esp32dev-500k-8mhz

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 921600
upload_speed = 921600

build_flags =
    -D SERIAL_BAUD=921600
    -D CORE_DEBUG_LEVEL=1
    -Wall
    -Wextra
    -Wshadow

; The default target. Most inexpensive MCP2515 boards carry an 8 MHz crystal.
[env:esp32dev-500k-8mhz]
build_flags =
    ${env.build_flags}
    -D CAN_BITRATE_KBPS=500
    -D MCP2515_OSCILLATOR_MHZ=8

[env:esp32dev-250k-8mhz]
build_flags =
    ${env.build_flags}
    -D CAN_BITRATE_KBPS=250
    -D MCP2515_OSCILLATOR_MHZ=8

; For a 16 MHz board, copy either environment and change the oscillator macro
; to 16. For very heavy traffic, also use SERIAL_BAUD=2000000 and match the
; Python --baud argument plus monitor_speed.
